<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Wand Body Gradient -->
    <linearGradient id="wandBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Wand Tip Gold/Cyan Gradient -->
    <linearGradient id="wandTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Checkerboard Pattern -->
    <pattern id="checkers2" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#1e293b" />
      <rect x="14" width="14" height="14" fill="#334155" />
      <rect y="14" width="14" height="14" fill="#334155" />
      <rect x="14" y="14" width="14" height="14" fill="#1e293b" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="wandGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Icon Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg2)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2" />

  <!-- Background Cutout Portal with Checkerboard -->
  <g transform="translate(256, 256)">
    <!-- Radial Outer Ring -->
    <circle r="160" fill="none" stroke="rgba(99,102,241,0.25)" stroke-width="4" stroke-dasharray="12 8" />
    <circle r="140" fill="url(#checkers2)" stroke="#475569" stroke-width="3" />
    
    <!-- Clean Cut Silhouette Subject in Center -->
    <path d="M -50 80 C -50 20, -30 -10, 0 -10 C 30 -10, 50 20, 50 80 Z" fill="#6366f1" />
    <circle cx="0" cy="-45" r="32" fill="#818cf8" />
    <!-- Cut dashed aura line -->
    <circle cx="0" cy="10" r="105" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  </g>

  <!-- Magic Wand Shaft -->
  <g filter="url(#wandGlow)">
    <!-- Wand Handle -->
    <path d="M 120 400 L 250 270" stroke="url(#wandBody)" stroke-width="20" stroke-linecap="round" />
    <path d="M 120 400 L 170 350" stroke="#f43f5e" stroke-width="22" stroke-linecap="round" />
    
    <!-- Wand Glowing Tip -->
    <path d="M 250 270 L 330 190" stroke="url(#wandTip)" stroke-width="20" stroke-linecap="round" />
    
    <!-- Tip Cap and Radiance -->
    <circle cx="330" cy="190" r="14" fill="#ffffff" />
    <circle cx="330" cy="190" r="28" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Cosmic Magic Sparkles -->
  <g fill="#ffffff" filter="url(#wandGlow)">
    <!-- Main 4-point Star -->
    <path d="M 370 150 C 370 120, 390 100, 420 100 C 390 100, 370 80, 370 50 C 370 80, 350 100, 320 100 C 350 100, 370 120, 370 150 Z" fill="#38bdf8" />
    <circle cx="370" cy="100" r="8" fill="#ffffff" />
    
    <!-- Secondary Sparkles -->
    <path d="M 280 120 C 280 105, 290 95, 305 95 C 290 95, 280 85, 280 70 C 280 85, 270 95, 255 95 C 270 95, 280 105, 280 120 Z" fill="#ec4899" />
    <path d="M 430 220 C 430 208, 438 200, 450 200 C 438 200, 430 192, 430 180 C 430 192, 422 200, 410 200 C 422 200, 430 208, 430 220 Z" fill="#a855f7" />

    <!-- Radiant Glow Beads -->
    <circle cx="340" cy="250" r="6" fill="#38bdf8" />
    <circle cx="410" cy="140" r="5" fill="#f43f5e" />
    <circle cx="230" cy="210" r="4" fill="#a855f7" />
    <circle cx="300" cy="270" r="4" fill="#ffffff" />
  </g>
</svg>
