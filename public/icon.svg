<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#1e293b" />
      <rect x="16" width="16" height="16" fill="#334155" />
      <rect y="16" width="16" height="16" fill="#334155" />
      <rect x="16" y="16" width="16" height="16" fill="#1e293b" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Cutout card with checkerboard background -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="url(#checker)" stroke="#475569" stroke-width="4" />

  <!-- Cutout silhouette shape -->
  <g filter="url(#glow)">
    <!-- Wand / Laser cutter beam -->
    <path d="M120 392 L340 172" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Magic Sparkle Star -->
    <path d="M370 142 C370 120, 385 105, 407 105 C385 105, 370 90, 370 68 C370 90, 355 105, 333 105 C355 105, 370 120, 370 142 Z" fill="#38bdf8" />
    <path d="M300 210 C300 196, 310 186, 324 186 C310 186, 300 176, 300 162 C300 176, 290 186, 276 186 C290 186, 300 196, 300 210 Z" fill="#f43f5e" />
    <circle cx="390" cy="180" r="10" fill="#a855f7" />
    <circle cx="160" cy="350" r="12" fill="#38bdf8" />
  </g>

  <!-- Central Foreground Subject Icon (Clean Cut Subject) -->
  <g transform="translate(156, 156)">
    <circle cx="100" cy="65" r="45" fill="url(#accent)" />
    <path d="M40 185 C40 135 70 125 100 125 C130 125 160 135 160 185 Z" fill="url(#accent)" />
    <!-- Cut dashed line showing background removed -->
    <path d="M15 100 A85 85 0 0 1 185 100" stroke="#38bdf8" stroke-width="6" stroke-dasharray="10 8" fill="none" stroke-linecap="round" />
  </g>
</svg>
